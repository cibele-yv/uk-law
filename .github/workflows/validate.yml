name: Validate

# Every change to the data, schema or tools must still pass the validator.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies from pyproject.toml
        run: python -c "import tomllib; print(*tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'])" | xargs python -m pip install

      - name: Validate
        run: python -m tools.validate.run
